include hyde.conf

# Minimal Tab bar styling 
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        8.0


# === Persona 5 Royal Theme ===

# Special colors
foreground              #ffffff
background              #0a0a0a
selection_foreground    #000000
selection_background    #d4af37

cursor                  #e60012
cursor_text_color       #ffffff

url_color               #d4af37

# Tab bar
active_tab_foreground   #ffffff
active_tab_background   #e60012
inactive_tab_foreground #d4af37
inactive_tab_background #1a1a1a
tab_bar_background      #0a0a0a

# === The 16 ANSI colors ===
# Normal
color0  #1a1a1a
color1  #e60012
color2  #d4af37
color3  #f5c518
color4  #8b0000
color5  #c41e3a
color6  #b8860b
color7  #ffffff

# Bright
color8  #4a4a4a
color9  #ff1a2e
color10 #ffd700
color11 #ffdf4a
color12 #b22222
color13 #dc143c
color14 #daa520
color15 #ffffff
