[flavor]
dark = "gruvbox-dark"

# folder icons: same color as the flavor's folder names (#83a598) instead of the default bright blue
[icon]
prepend_dirs = [
  { name = "Desktop", text = "", fg = "#83a598" },
  { name = "Documents", text = "", fg = "#83a598" },
  { name = "Downloads", text = "", fg = "#83a598" },
  { name = "Music", text = "", fg = "#83a598" },
  { name = "Pictures", text = "", fg = "#83a598" },
  { name = "Public", text = "", fg = "#83a598" },
  { name = "Videos", text = "", fg = "#83a598" },
]
prepend_conds = [
  { if = "dir & hovered", text = "", fg = "#83a598" },
  { if = "dir", text = "", fg = "#83a598" },
]
