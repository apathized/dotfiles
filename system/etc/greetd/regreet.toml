[GTK]
application_prefer_dark_theme = true
font_name = "Iosevka Nerd Font 14"

[appearance]
greeting_msg = "Welcome back, Ryan"

[widget.clock]
format = "%a %b %d  %H:%M"
timezone = "America/Chicago"

[commands]
reboot = [ "systemctl", "reboot" ]
poweroff = [ "systemctl", "poweroff" ]

[background]
path = "/etc/greetd/background.jpg"
fit = "Cover"
