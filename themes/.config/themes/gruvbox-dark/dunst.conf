# Gruvbox Dark (morhetz) for dunst. Loaded as a drop-in after dunstrc.
# Colors are #RRGGBBAA. d9 = 85% opaque, matching the waybar pills.

[global]
    # fg4 at 25%: the same faint outline as the waybar pills
    frame_color = "#a8998440"
    # progress bars (volume, brightness, etc.)
    highlight = "#fe8019"

[urgency_low]
    background = "#1d2021d9"
    foreground = "#a89984"

[urgency_normal]
    background = "#1d2021d9"
    foreground = "#ebdbb2"

[urgency_critical]
    background = "#1d2021d9"
    foreground = "#ebdbb2"
    frame_color = "#fb4934"
