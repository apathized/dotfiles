#Created by Ryan M
# Colors come from the active theme (~/.config/themes/current/hyprlock.conf).
source = ~/.config/themes/current/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
    vibrancy = 0.17
}

# clock
label {
    monitor = DP-1
    text = $TIME
    color = $fg
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# date
label {
    monitor = DP-1
    text = cmd[update:60000] date +"%A, %B %d"
    color = $fg4
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

# password field
input-field {
    monitor = DP-1
    size = 340, 54
    rounding = 14
    outline_thickness = 2
    outer_color = $accent
    inner_color = $panel
    font_color = $fg
    check_color = $accent2
    fail_color = $red
    capslock_color = $accent2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    placeholder_text = password
    fail_text = $FAIL
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

# snappier animations
animations {
    enabled = true
    bezier = snappy, 0.25, 1, 0.5, 1
    animation = inputFieldDots, 1, 1, snappy
    animation = inputFieldColors, 1, 2, snappy
    animation = fadeIn, 1, 3, snappy
    animation = fadeOut, 1, 3, snappy
}
